[workspace]
members = [
    "src-tauri",
    "crates/cws-core",
    "crates/cws-storage",
    "crates/cws-search",
    "crates/cws-ai",
    "crates/cws-graph",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev]
opt-level = 0
debug = 0

[profile.release]
lto = true
codegen-units = 1
strip = true
